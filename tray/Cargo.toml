[package]
name = "tokenhud-tray"
version = "0.0.0"
description = "TokenHUD system tray shell (version comes from ../package.json)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
codegen-units = 16
strip = true
panic = "abort"
